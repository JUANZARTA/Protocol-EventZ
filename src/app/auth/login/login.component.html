<div class="flex min-h-screen flex-col justify-center bg-black px-6 py-10 text-white">
  <div class="mx-auto w-full max-w-sm">
    <div class="mb-10 text-center">
      <p class="text-xs uppercase tracking-[0.3em] text-gold-400">Protocol</p>
      <h1 class="text-3xl font-semibold tracking-tight">Event<span class="text-gold-400">Z</span></h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-4">
      <div>
        <label class="mb-1 block text-xs text-white/50">Correo</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-lg border border-white/15 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-gold-400"
          [class.border-red-500]="invalido('email')"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs text-white/50">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-white/15 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-gold-400"
          [class.border-red-500]="invalido('password')"
        />
      </div>

      <p *ngIf="error" class="text-sm text-red-400">{{ error }}</p>

      <button
        type="submit"
        [disabled]="cargando"
        class="w-full rounded-lg bg-gold-400 py-2.5 text-sm font-semibold text-black transition hover:bg-gold-300 disabled:opacity-50"
      >
        {{ cargando ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-white/50">
      ¿No tenés cuenta? <a routerLink="/registro" class="text-gold-400 hover:underline">Registrate</a>
    </p>

    <div *ngIf="canInstallApp" class="mt-8 rounded-lg border border-gold-400/30 bg-gold-400/5 p-3 text-center">
      <p class="mb-2 text-xs text-white/70">Instalá la app en tu teléfono</p>
      <button (click)="instalarApp()" class="rounded-full bg-gold-400 px-4 py-1.5 text-xs font-semibold text-black">
        Instalar
      </button>
    </div>

    <div *ngIf="isIos && !appInstalled" class="mt-8 rounded-lg border border-white/10 p-3 text-center text-xs text-white/50">
      En iPhone: tocá <strong>Compartir</strong> y luego <strong>"Agregar a inicio"</strong> para instalar la app.
    </div>
  </div>
</div>
